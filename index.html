<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Tap</title>
<meta name="description" content="Custom NFC cards and keychains for your social, business, and brand.">
<meta name="theme-color" content="#FFFFFF">
<link rel="stylesheet" href="styles.css">
</head>
<body class="landing-page">
<div class="landing-shell">
  <header class="landing-header">
    <nav class="landing-nav" aria-label="Main navigation">
      <span>TAP</span>
      <span>•</span>
      <span>CONNECT</span>
      <span>•</span>
      <span>GROW</span>
    </nav>
    <a id="home-account-link" class="account-link" href="customer-login.html">My Account</a>
  </header>

  <main class="landing-hero">
    <section class="landing-copy fade-item">
      <h1 id="home-headline">Your Link.<br><span id="home-subheadline">One Tap.</span></h1>
      <p id="home-description">Custom NFC cards &amp; keychains for your social, business, and brand.</p>

      <div id="home-badges" class="product-badges" aria-label="One Tap socials">
        <span>ONE TAP</span>
        <span>FACEBOOK</span>
        <span>TIKTOK</span>
        <span>LINKEDIN</span>
        <span>ANY LINK</span>
      </div>
    </section>

    <section class="landing-visual fade-item" aria-label="One Tap product preview">
      <img id="home-image" src="img/ONE TAP.png" alt="One Tap product mockup">
    </section>
  </main>
</div>

<script src="guest-admin.js"></script>
<script>
  const settings = getHomePageSettings();

  if (settings.headline) {
    const headlineWrap = document.getElementById('home-headline');
    headlineWrap.innerHTML = settings.headline + (settings.subheadline ? '<br><span>' + settings.subheadline + '</span>' : '');
  }

  if (settings.description) {
    document.getElementById('home-description').textContent = settings.description;
  }

  if (settings.image) {
    const image = document.getElementById('home-image');
    image.src = settings.image;
    image.alt = settings.subheadline || 'One Tap product mockup';
  }

  if (settings.accountText) {
    document.getElementById('home-account-link').textContent = settings.accountText;
  }

  if (Array.isArray(settings.badges) && settings.badges.length) {
    const badgeWrap = document.getElementById('home-badges');
    badgeWrap.innerHTML = settings.badges.map(label => '<span>' + label + '</span>').join('');
  }
</script>
</body>
</html>
