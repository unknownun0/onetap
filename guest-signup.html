<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guest signup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <section class="form-section fade-item">
      <h1 class="form-title">Create your guest account</h1>
      <p class="form-subtitle">Use the invite link from the admin to finish your account setup.</p>

      <form id="guest-signup-form">
        <p class="section-hint">Only invited guests can create an account. Your email must match the admin invite exactly.</p>

        <label class="field">
          <span>Full name</span>
          <input type="text" id="signup-name" required>
        </label>

        <label class="field">
          <span>Email</span>
          <input type="email" id="signup-email" required>
        </label>

        <label class="field">
          <span>Password</span>
          <input type="password" id="signup-password" required>
        </label>

        <button type="submit" class="primary-cta">Create account</button>
      </form>
    </section>
  </div>

  <script src="guest-admin.js"></script>
  <script>
    async function loadInviteState() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      if (!token) {
        alert('This invite link is invalid.');
        window.location.href = 'customer-login.html';
        return null;
      }

      const guests = await requestJson('/api/guests');
      const invitingGuest = Array.isArray(guests) ? guests.find(item => item.token === token) : null;

      if (!invitingGuest) {
        alert('This invite link is invalid.');
        window.location.href = 'customer-login.html';
        return null;
      }

      if (invitingGuest.status === 'used') {
        const redirect = invitingGuest.previewUrl || getUsedInviteRedirectUrl(token);
        alert('This invite has already been used. Redirecting to the customer preview page.');
        window.location.href = redirect || 'customer-account.html';
        return null;
      }

      return { token, invitingGuest };
    }

    let inviteState = null;

    loadInviteState().then((state) => {
      inviteState = state;
    }).catch(() => {
      alert('This invite link is invalid.');
      window.location.href = 'customer-login.html';
    });

    document.getElementById('guest-signup-form').addEventListener('submit', async (event) => {
      event.preventDefault();

      if (!inviteState || !inviteState.token) {
        alert('This invite link is invalid.');
        window.location.href = 'customer-login.html';
        return;
      }

      const result = await createGuestAccount({
        guestToken: inviteState.token,
        name: document.getElementById('signup-name').value,
        email: document.getElementById('signup-email').value,
        password: document.getElementById('signup-password').value
      });

      if (result.error) {
        alert(result.error);
        return;
      }

      alert('Account created successfully. Welcome!');
      window.location.href = 'customer-account.html';
    });
  </script>
</body>
</html>
