<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background: #F8FAFC;
    }
    .page {
      max-width: 700px;
    }
    .account-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }
    .account-summary {
      width: 100%;
      background: linear-gradient(135deg, #0f172a 0%, #1e40af 50%, #1d4ed8 100%);
      color: white;
      border: none;
      padding: 20px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      text-align: left;
      cursor: pointer;
      transition: filter var(--transition-fast);
    }
    .account-summary:hover {
      filter: brightness(1.05);
    }
    .account-summary-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .account-summary-eyebrow {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.7;
      font-weight: 600;
    }
    .account-summary-name {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .account-summary-note {
      font-size: 12px;
      opacity: 0.7;
    }
    .account-mini-status {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .account-mini-status .status-pill {
      background: rgba(255,255,255,0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(8px);
    }
    .account-toggle-caret {
      display: inline-flex;
      width: 28px;
      height: 28px;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      transition: transform var(--transition-base);
      font-size: 18px;
    }
    .account-card.is-open .account-toggle-caret {
      transform: rotate(180deg);
    }
    .account-details {
      padding: 20px 22px 22px;
      display: none;
      animation: fadeUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .account-card.is-open .account-details {
      display: block;
    }
    .account-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
    }
    .account-row:last-child {
      border-bottom: none;
    }
    .account-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }
    .account-value {
      font-weight: 600;
      text-align: right;
      word-break: break-word;
      font-size: 14px;
    }
    .account-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="form-section fade-item">
      <h1 class="form-title">My account</h1>
      <p class="form-subtitle">This is your customer portal after registration.</p>

      <div id="account-card" class="account-card is-open">
        <button type="button" id="account-summary-toggle" class="account-summary" aria-expanded="true" aria-controls="account-details">
          <div class="account-summary-text">
            <span class="account-summary-eyebrow">My account</span>
            <span id="acct-name-summary" class="account-summary-name">Customer</span>
            <span class="account-summary-note">This is your customer portal after registration.</span>
          </div>
          <div class="account-mini-status">
            <span id="acct-status" class="status-pill">Active</span>
            <span class="account-toggle-caret">▾</span>
          </div>
        </button>

        <div id="account-details" class="account-details">
          <div class="account-row">
            <span class="account-label">Name</span>
            <span id="acct-name" class="account-value">—</span>
          </div>
          <div class="account-row">
            <span class="account-label">Email</span>
            <span id="acct-email" class="account-value">—</span>
          </div>
          <div class="account-row">
            <span class="account-label">Role</span>
            <span id="acct-role" class="account-value">—</span>
          </div>
          <div class="account-row">
            <span class="account-label">Status</span>
            <span id="acct-status-detail" class="account-value">Active</span>
          </div>

          <div class="account-actions">
            <button type="button" id="logout-customer" class="secondary-cta">Logout</button>
            <a href="index.html" class="primary-cta" style="display:inline-block; text-align:center; text-decoration:none;">Back to home</a>
          </div>
        </div>
      </div>
    </section>

    <section class="form-section fade-item">
      <h2 class="section-heading">Profile settings</h2>
      <p class="section-hint">Update your public profile and preview the live page.</p>

      <form id="customer-profile-form">
        <label class="field">
          <span>Full name</span>
          <input id="profile-name" type="text" required>
        </label>

        <label class="field">
          <span>Title</span>
          <input id="profile-title" type="text" placeholder="Brand designer">
        </label>

        <label class="field">
          <span>Tagline</span>
          <input id="profile-tagline" type="text" placeholder="Helping brands stand out">
        </label>

        <label class="field">
          <span>Accent color</span>
          <input id="profile-accent" type="color" value="#2563EB">
        </label>

        <label class="field">
          <span>Theme</span>
          <select id="profile-theme">
            <option value="light">Light mode</option>
            <option value="dark">Dark mode</option>
          </select>
        </label>

        <label class="field">
          <span>Share mode</span>
          <select id="profile-mode">
            <option value="public">Public share</option>
            <option value="local">Local preview</option>
          </select>
        </label>

        <label class="field">
          <span>Profile photo</span>
          <input id="profile-avatar-upload" type="file" accept="image/*">
        </label>

        <label class="field">
          <span>Profile photo URL</span>
          <input id="profile-avatar-url" type="url" placeholder="https://example.com/avatar.jpg">
        </label>

        <label class="field">
          <span>Phone number</span>
          <input id="profile-phone" type="tel" placeholder="+1 555 123 4567">
        </label>

        <label class="field">
          <span>Company name</span>
          <input id="profile-company" type="text" placeholder="One Tap Studio">
        </label>

        <label class="field">
          <span>Location / address</span>
          <input id="profile-location" type="text" placeholder="Singapore, Singapore">
        </label>

        <label class="field">
          <span>Instagram</span>
          <input id="profile-instagram" type="url" placeholder="https://instagram.com/yourname">
        </label>

        <label class="field">
          <span>Facebook</span>
          <input id="profile-facebook" type="url" placeholder="https://facebook.com/yourname">
        </label>

        <label class="field">
          <span>TikTok</span>
          <input id="profile-tiktok" type="url" placeholder="https://tiktok.com/@yourname">
        </label>

        <label class="field">
          <span>Bio description</span>
          <textarea id="profile-bio" rows="3" placeholder="Helping brands stand out with memorable digital experiences."></textarea>
        </label>

        <label class="field">
          <span>Website</span>
          <input id="profile-website" type="url" placeholder="https://example.com">
        </label>

        <button type="submit" class="primary-cta">Save profile</button>
      </form>

      <div class="account-actions" style="margin-top: 12px;">
        <button type="button" id="preview-profile" class="secondary-cta">Open preview</button>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
  <script src="guest-admin.js"></script>
  <script>
    const session = getCustomerSession();

    function getCurrentProfile() {
      const profileFromStore = getCustomerProfile() || {};
      return {
        name: session ? session.name || 'Customer' : 'Customer',
        title: '',
        tagline: '',
        accent: '#2563EB',
        website: '',
        theme: 'light',
        mode: 'public',
        ...profileFromStore
      };
    }

    function renderAccount() {
      const card = document.getElementById('account-card');
      const nameEl = document.getElementById('acct-name');
      const nameSummaryEl = document.getElementById('acct-name-summary');
      const emailEl = document.getElementById('acct-email');
      const roleEl = document.getElementById('acct-role');
      const statusEl = document.getElementById('acct-status');
      const statusDetailEl = document.getElementById('acct-status-detail');

      if (!session) {
        card.innerHTML = '<p class="form-subtitle">You need to log in to view this page.</p><a href="customer-login.html" class="primary-cta" style="display:inline-block; text-align:center; text-decoration:none;">Go to customer login</a>';
        return;
      }

      const profile = getCurrentProfile();
      document.body.classList.toggle('theme-dark', profile.theme === 'dark');
      document.body.classList.toggle('theme-light', profile.theme !== 'dark');

      const accountName = profile.name || 'Customer';
      nameEl.textContent = accountName;
      nameSummaryEl.textContent = accountName;
      emailEl.textContent = session.email || '—';
      roleEl.textContent = (session.role || 'guest').toUpperCase();
      statusEl.textContent = 'Active';
      statusDetailEl.textContent = 'Active';

      document.getElementById('profile-name').value = profile.name || '';
      document.getElementById('profile-title').value = profile.title || '';
      document.getElementById('profile-tagline').value = profile.tagline || '';
      document.getElementById('profile-accent').value = profile.accent || '#2563EB';
      document.getElementById('profile-theme').value = profile.theme === 'dark' ? 'dark' : 'light';
      document.getElementById('profile-mode').value = profile.mode === 'local' ? 'local' : 'public';
      document.getElementById('profile-avatar-url').value = profile.avatarUrl || profile.avatar || '';
      document.getElementById('profile-phone').value = profile.phone || '';
      document.getElementById('profile-company').value = profile.company || '';
      document.getElementById('profile-location').value = profile.location || '';
      document.getElementById('profile-instagram').value = profile.instagram || '';
      document.getElementById('profile-facebook').value = profile.facebook || '';
      document.getElementById('profile-tiktok').value = profile.tiktok || '';
      document.getElementById('profile-bio').value = profile.bio || '';
      document.getElementById('profile-website').value = profile.website || '';
    }

    renderAccount();

    document.getElementById('account-summary-toggle').addEventListener('click', () => {
      const card = document.getElementById('account-card');
      const isOpen = card.classList.toggle('is-open');
      document.getElementById('account-summary-toggle').setAttribute('aria-expanded', String(isOpen));
    });

    document.getElementById('customer-profile-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!session) {
        window.location.href = 'customer-login.html';
        return;
      }

      const fileInput = document.getElementById('profile-avatar-upload');
      const avatarUrl = document.getElementById('profile-avatar-url').value.trim();
      let avatar = (getCurrentProfile().avatar || avatarUrl || '').trim();

      if (fileInput && fileInput.files && fileInput.files[0]) {
        avatar = await readFileAsDataUrl(fileInput.files[0]);
      } else if (avatarUrl) {
        avatar = avatarUrl;
      }

      const payload = saveCustomerProfile({
        name: document.getElementById('profile-name').value,
        title: document.getElementById('profile-title').value,
        tagline: document.getElementById('profile-tagline').value,
        accent: document.getElementById('profile-accent').value,
        theme: document.getElementById('profile-theme').value,
        mode: document.getElementById('profile-mode').value,
        website: document.getElementById('profile-website').value,
        company: document.getElementById('profile-company').value,
        phone: document.getElementById('profile-phone').value,
        location: document.getElementById('profile-location').value,
        instagram: document.getElementById('profile-instagram').value,
        facebook: document.getElementById('profile-facebook').value,
        tiktok: document.getElementById('profile-tiktok').value,
        bio: document.getElementById('profile-bio').value,
        avatar,
        avatarUrl: avatar
      });

      if (payload.error) {
        alert(payload.error);
        return;
      }

      renderAccount();
      alert('Profile saved.');
    });

    document.getElementById('preview-profile').addEventListener('click', () => {
      const profile = getCurrentProfile();
      profile.name = document.getElementById('profile-name').value || profile.name;
      profile.title = document.getElementById('profile-title').value || '';
      profile.tagline = document.getElementById('profile-tagline').value || '';
      profile.accent = document.getElementById('profile-accent').value || '#2563EB';
      profile.theme = document.getElementById('profile-theme').value || 'light';
      profile.mode = document.getElementById('profile-mode').value || 'public';
      profile.company = document.getElementById('profile-company').value || '';
      profile.phone = document.getElementById('profile-phone').value || '';
      profile.location = document.getElementById('profile-location').value || '';
      profile.instagram = document.getElementById('profile-instagram').value || '';
      profile.facebook = document.getElementById('profile-facebook').value || '';
      profile.tiktok = document.getElementById('profile-tiktok').value || '';
      profile.bio = document.getElementById('profile-bio').value || '';
      profile.avatarUrl = document.getElementById('profile-avatar-url').value || profile.avatar || '';
      profile.avatar = profile.avatarUrl;
      profile.website = document.getElementById('profile-website').value || '';
      saveCustomerProfile(profile);
      window.location.href = 'profile.html#data=' + encodeProfile(profile);
    });

    document.getElementById('logout-customer').addEventListener('click', () => {
      logoutCustomer();
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
