<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guest admin</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background: #f8fafc;
    }
    .page {
      max-width: 760px;
    }
    .admin-panel {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, .05);
      margin-bottom: 22px;
    }
    .admin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }
    .admin-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      background: #f8fafc;
    }
    .guest-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }
    .guest-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      background: white;
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }
    .guest-item strong { display: block; margin-bottom: 6px; }
    .guest-meta { font-size: 13px; color: var(--muted); }
    .qr-box {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 10px;
      min-height: 150px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px dashed var(--border);
      overflow: hidden;
    }
    .qr-box img {
      width: 180px;
      height: 180px;
      object-fit: contain;
    }
    .link-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: auto;
      padding-top: 12px;
    }
    .link-row input {
      flex: 1;
      min-width: 0;
    }
    .guest-item-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }
    .status-pill {
      display: inline-block;
      background: rgba(37,99,235,.08);
      color: var(--accent);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-pill--used {
      background: rgba(22,163,74,.1);
      color: #15803d;
    }
    .tiny-btn {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      background: white;
    }
    .admin-table-wrap {
      overflow-x: auto;
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 640px;
    }
    .admin-table th,
    .admin-table td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      vertical-align: middle;
    }
    .admin-table th {
      color: var(--muted);
      font-weight: 600;
      background: #f8fafc;
    }
    .table-action-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .table-action-btn {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      padding: 7px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .table-action-btn--danger {
      border-color: rgba(220, 38, 38, 0.2);
      color: #b91c1c;
    }
    .admin-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 16px 0 18px;
    }
    .tab-btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .tab-btn.is-active {
      background: #0f172a;
      border-color: #0f172a;
      color: #fff;
    }
    .tab-panel {
      display: none;
    }
    .tab-panel.is-active {
      display: block;
    }
    .hidden {
      display: none !important;
    }
    @media (max-width: 980px) {
      .guest-list {
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }
    }

    @media (max-width: 640px) {
      .page { padding: 20px 14px 48px; }
      .admin-panel { padding: 16px; }
      .admin-tabs { gap: 6px; }
      .tab-btn { padding: 8px 10px; font-size: 12px; }
      .guest-list {
        grid-template-columns: 1fr;
      }
      .link-row {
        flex-direction: column;
        align-items: stretch;
      }
      .tiny-btn, .table-action-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="form-header fade-item">
      <h1 class="form-title">Guest admin</h1>
      <p class="form-subtitle">Create guest invites and generate QR codes that let new people create their account.</p>
    </header>

    <section id="admin-login-panel" class="admin-panel fade-item">
      <h2 class="section-heading">Admin login</h2>
      <p class="section-hint">Default credentials: admin / admin123</p>
      <form id="admin-login-form">
        <label class="field">
          <span>Username</span>
          <input type="text" id="admin-user" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" id="admin-pass" required>
        </label>
        <button type="submit" class="primary-cta">Login</button>
      </form>
    </section>

    <section id="admin-dashboard" class="hidden">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px;">
        <h2 class="section-heading" style="margin:0;">Dashboard</h2>
        <button type="button" id="logout-btn" class="secondary-cta" style="padding:10px 14px;">Logout</button>
      </div>

      <div class="admin-tabs" aria-label="Admin sections">
        <button type="button" class="tab-btn is-active" data-tab="home-panel">Home</button>
        <button type="button" class="tab-btn" data-tab="guest-panel">Guests</button>
        <button type="button" class="tab-btn" data-tab="customer-panel">Customers</button>
      </div>

      <section id="home-panel" class="tab-panel is-active admin-panel fade-item">
        <h2 class="section-heading">Home page content</h2>
        <form id="home-page-form">
          <div class="admin-grid">
            <label class="field">
              <span>Headline</span>
              <input id="home-headline" type="text" placeholder="Your Link." required>
            </label>
            <label class="field">
              <span>Subheadline</span>
              <input id="home-subheadline" type="text" placeholder="One Tap." required>
            </label>
          </div>
          <label class="field">
            <span>Description</span>
            <textarea id="home-description" rows="3" placeholder="Custom NFC cards & keychains for your social, business and brand."></textarea>
          </label>
          <div class="admin-grid">
            <label class="field">
              <span>Image URL</span>
              <input id="home-image" type="url" placeholder="https://example.com/image.png">
            </label>
            <label class="field">
              <span>Upload image</span>
              <input id="home-image-upload" type="file" accept="image/*">
            </label>
          </div>
          <div class="admin-grid">
            <label class="field">
              <span>My Account button text</span>
              <input id="home-account-text" type="text" placeholder="My Account">
            </label>
          </div>
          <label class="field">
            <span>Badges (comma separated)</span>
            <input id="home-badges" type="text" placeholder="ONE TAP, FACEBOOK, TIKTOK, LINKEDIN, ANY LINK">
          </label>
          <button type="submit" class="primary-cta">Save home page</button>
        </form>
      </section>

      <section id="guest-panel" class="tab-panel">
        <section class="admin-panel fade-item">
          <h2 class="section-heading">Create guest invite</h2>
          <form id="guest-form">
            <div class="admin-grid">
              <label class="field">
                <span>Guest name</span>
                <input id="guest-name" name="name" type="text" placeholder="Jane Doe" required>
              </label>
              <label class="field">
                <span>Email</span>
                <input id="guest-email" name="email" type="email" placeholder="jane@example.com" required>
              </label>
            </div>
            <label class="field">
              <span>Notes</span>
              <input id="guest-notes" name="notes" type="text" placeholder="VIP customer, sales team...">
            </label>
            <button type="submit" class="primary-cta">Create invite</button>
          </form>
        </section>

        <section class="admin-panel fade-item">
          <h2 class="section-heading">Recent invites</h2>
          <ul id="guest-list" class="guest-list"></ul>
        </section>
      </section>

      <section id="customer-panel" class="tab-panel">
        <section class="admin-panel fade-item">
          <h2 class="section-heading">Customer accounts</h2>
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Status</th>
                  <th>Created</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="account-table-body"></tbody>
            </table>
          </div>
        </section>
      </section>
    </section>
  </div>

  <script src="guest-admin.js"></script>
  <script>
    function showDashboard(show) {
      const loginPanel = document.getElementById('admin-login-panel');
      const dashboard = document.getElementById('admin-dashboard');
      loginPanel.classList.toggle('hidden', show);
      dashboard.classList.toggle('hidden', !show);
    }

    function activateAdminTab(tabId) {
      const buttons = document.querySelectorAll('.tab-btn');
      const panels = document.querySelectorAll('.tab-panel');

      buttons.forEach((button) => {
        const active = button.getAttribute('data-tab') === tabId;
        button.classList.toggle('is-active', active);
      });

      panels.forEach((panel) => {
        panel.classList.toggle('is-active', panel.id === tabId);
      });
    }

    document.querySelectorAll('.tab-btn').forEach((button) => {
      button.addEventListener('click', () => {
        activateAdminTab(button.getAttribute('data-tab'));
      });
    });

    function renderGuestList() {
      const list = document.getElementById('guest-list');
      const guests = listGuests();
      list.innerHTML = '';

      if (!guests.length) {
        const empty = document.createElement('li');
        empty.className = 'guest-item';
        empty.innerHTML = '<strong>No invites yet</strong><div class="guest-meta">Create one to generate a QR link for signup.</div>';
        list.appendChild(empty);
        return;
      }

      guests.slice().reverse().forEach((guest) => {
        const item = document.createElement('li');
        item.className = 'guest-item';

        const status = guest.status === 'used' ? 'Used' : 'Pending';
        const displayLink = guest.status === 'used' ? (guest.previewUrl || guest.signupUrl) : guest.signupUrl;
        const displayQr = guest.status === 'used' ? (guest.previewUrl ? getQrDisplayUrl(guest.previewUrl) : guest.qrUrl) : guest.qrUrl || getQrDisplayUrl(guest.signupUrl);

        item.innerHTML = `
          <strong>${guest.name}</strong>
          <div class="guest-meta">${guest.email}</div>
          <div class="guest-meta">${guest.notes || 'No notes'}</div>
          <div style="margin-top:10px;">
            <span class="status-pill ${guest.status === 'used' ? 'status-pill--used' : ''}">${status}</span>
          </div>
          <div class="qr-box">
            <img src="${displayQr}" alt="QR code for ${guest.name}" />
          </div>
          <div class="link-row">
            <input type="text" readonly value="${displayLink}" aria-label="${guest.status === 'used' ? 'Customer preview URL' : 'Guest sign-up URL'}">
            <button class="tiny-btn" type="button" data-copy="${displayLink}">Copy</button>
          </div>
          <div class="guest-item-actions">
            <button class="table-action-btn table-action-btn--danger" type="button" data-delete-invite="${guest.id}">Delete link</button>
          </div>
        `;

        const copyBtn = item.querySelector('[data-copy]');
        copyBtn.addEventListener('click', async () => {
          await navigator.clipboard.writeText(displayLink);
          alert(guest.status === 'used' ? 'Preview link copied' : 'Invite link copied');
        });

        const deleteBtn = item.querySelector('[data-delete-invite]');
        deleteBtn.addEventListener('click', () => {
          deleteGuestInvite(guest.id);
          renderGuestList();
        });

        list.appendChild(item);
      });
    }

    function renderHomePageForm() {
      const settings = getHomePageSettings();
      document.getElementById('home-headline').value = settings.headline || 'Your Link.';
      document.getElementById('home-subheadline').value = settings.subheadline || 'One Tap.';
      document.getElementById('home-description').value = settings.description || 'Custom NFC cards & keychains for your social, business and brand.';
      document.getElementById('home-image').value = settings.image || 'img/ONE TAP.png';
      document.getElementById('home-account-text').value = settings.accountText || 'My Account';
      document.getElementById('home-badges').value = Array.isArray(settings.badges) ? settings.badges.join(', ') : 'ONE TAP, FACEBOOK, TIKTOK, LINKEDIN, ANY LINK';
    }

    function renderAccountTable() {
      const tbody = document.getElementById('account-table-body');
      const accounts = listAccounts();
      tbody.innerHTML = '';

      if (!accounts.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="guest-meta">No customer accounts yet.</td></tr>';
        return;
      }

      accounts.forEach((account) => {
        const row = document.createElement('tr');
        const statusLabel = (account.status || 'active') === 'inactive' ? 'Inactive' : 'Active';
        row.innerHTML = `
          <td>${account.name || 'Customer'}</td>
          <td>${account.email || '—'}</td>
          <td><span class="status-pill ${account.status === 'inactive' ? 'status-pill--used' : ''}">${statusLabel}</span></td>
          <td>${new Date(account.createdAt || Date.now()).toLocaleDateString()}</td>
          <td>
            <div class="table-action-row">
              <button class="table-action-btn" type="button" data-account-action="toggle" data-account-id="${account.id}">${account.status === 'inactive' ? 'Activate' : 'Deactivate'}</button>
              <button class="table-action-btn table-action-btn--danger" type="button" data-account-action="delete" data-account-id="${account.id}">Delete</button>
            </div>
          </td>
        `;
        tbody.appendChild(row);
      });

      document.querySelectorAll('[data-account-action]').forEach((button) => {
        button.addEventListener('click', () => {
          const accountId = button.getAttribute('data-account-id');
          const action = button.getAttribute('data-account-action');

          if (action === 'toggle') {
            const account = listAccounts().find(item => item.id === accountId);
            if (!account) return;
            const updated = account.status === 'inactive' ? { ...account, status: 'active' } : { ...account, status: 'inactive' };
            setStore('accounts', listAccounts().map(item => item.id === accountId ? updated : item));
            renderAccountTable();
            return;
          }

          if (action === 'delete') {
            deleteAccount(accountId);
            renderAccountTable();
          }
        });
      });
    }

    document.getElementById('admin-login-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const result = loginAdmin({
        username: document.getElementById('admin-user').value,
        password: document.getElementById('admin-pass').value
      });

      if (!result.ok) {
        alert(result.error);
        return;
      }

      showDashboard(true);
      document.getElementById('admin-login-form').reset();
      renderGuestList();
      renderAccountTable();
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
      logoutAdmin();
      showDashboard(false);
    });

    document.getElementById('guest-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const result = createGuestInvite({
        name: document.getElementById('guest-name').value,
        email: document.getElementById('guest-email').value,
        notes: document.getElementById('guest-notes').value
      });

      if (result.error) {
        alert(result.error);
        return;
      }

      document.getElementById('guest-form').reset();
      renderGuestList();
      alert('Guest invite created successfully');
    });

    document.getElementById('home-page-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const homeFileInput = document.getElementById('home-image-upload');
      let imageValue = document.getElementById('home-image').value.trim();

      if (homeFileInput && homeFileInput.files && homeFileInput.files[0]) {
        imageValue = await readFileAsDataUrl(homeFileInput.files[0]);
      }

      const settings = {
        headline: document.getElementById('home-headline').value.trim(),
        subheadline: document.getElementById('home-subheadline').value.trim(),
        description: document.getElementById('home-description').value.trim(),
        image: imageValue,
        accountText: document.getElementById('home-account-text').value.trim() || 'My Account',
        badges: document.getElementById('home-badges').value.split(',').map(item => item.trim()).filter(Boolean)
      };

      setHomePageSettings(settings);
      renderHomePageForm();
      alert('Home page updated successfully');
      window.location.href = 'index.html';
    });

    if (getAdminSession()) {
      showDashboard(true);
    } else {
      showDashboard(false);
    }

    renderGuestList();
    renderHomePageForm();
    renderAccountTable();
  </script>
</body>
</html>
