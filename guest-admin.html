<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guest admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background: #F8FAFC;
    }
    .page {
      max-width: 760px;
    }
    .admin-panel {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      box-shadow: var(--shadow-md);
      margin-bottom: 22px;
    }
    .admin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }
    .admin-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      background: var(--soft-bg);
      transition: box-shadow var(--transition-fast);
    }
    .admin-card:hover {
      box-shadow: var(--shadow-sm);
    }
    .guest-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }
    .guest-item {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      background: white;
      display: flex;
      flex-direction: column;
      min-height: 100%;
      transition: all var(--transition-fast);
    }
    .guest-item:hover {
      box-shadow: var(--shadow-sm);
    }
    .guest-item strong {
      display: block;
      margin-bottom: 6px;
      font-size: 15px;
    }
    .guest-meta {
      font-size: 13px;
      color: var(--muted);
    }
    .qr-box {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 12px;
      min-height: 150px;
      border-radius: 12px;
      background: var(--soft-bg);
      border: 1px dashed var(--border);
      overflow: hidden;
    }
    .qr-box img {
      width: 180px;
      height: 180px;
      object-fit: contain;
    }
    .link-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: auto;
      padding-top: 12px;
    }
    .link-row input {
      flex: 1;
      min-width: 0;
    }
    .guest-item-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      background: var(--accent-light);
      color: var(--accent);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-pill--used {
      background: rgba(22, 163, 74, 0.1);
      color: #15803d;
    }
    .tiny-btn {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      background: white;
      font-size: 13px;
      font-weight: 500;
      transition: all var(--transition-fast);
    }
    .tiny-btn:hover {
      background: var(--soft-bg);
      border-color: #CBD5E1;
    }
    .admin-table-wrap {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 640px;
    }
    .admin-table th,
    .admin-table td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      vertical-align: middle;
    }
    .admin-table th {
      color: var(--muted);
      font-weight: 600;
      background: var(--soft-bg);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .admin-table tr:last-child td {
      border-bottom: none;
    }
    .table-action-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .table-action-btn {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .table-action-btn:hover {
      background: var(--soft-bg);
      border-color: #CBD5E1;
    }
    .table-action-btn--danger {
      border-color: rgba(220, 38, 38, 0.2);
      color: #b91c1c;
    }
    .table-action-btn--danger:hover {
      background: #FEF2F2;
      border-color: rgba(220, 38, 38, 0.3);
    }
    .table-action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .admin-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 18px 0 20px;
    }
    .tab-btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .tab-btn:hover {
      background: var(--soft-bg);
    }
    .tab-btn.is-active {
      background: #0f172a;
      border-color: #0f172a;
      color: #fff;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.2);
    }
    .tab-panel {
      display: none;
    }
    .tab-panel.is-active {
      display: block;
      animation: fadeUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .hidden {
      display: none !important;
    }
    .loading-state {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      color: var(--muted);
      font-size: 14px;
    }
    .loading-spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .error-state {
      padding: 24px;
      text-align: center;
      color: #b91c1c;
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: 12px;
      margin: 16px 0;
    }
    .error-state button {
      margin-top: 12px;
    }
    @media (max-width: 980px) {
      .guest-list {
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }
    }
    @media (max-width: 640px) {
      .page { padding: 20px 14px 48px; }
      .admin-panel { padding: 16px; border-radius: 14px; }
      .admin-tabs { gap: 6px; }
      .tab-btn { padding: 8px 12px; font-size: 12px; }
      .guest-list {
        grid-template-columns: 1fr;
      }
      .link-row {
        flex-direction: column;
        align-items: stretch;
      }
      .tiny-btn, .table-action-btn {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="form-header fade-item">
      <h1 class="form-title">Guest admin</h1>
      <p class="form-subtitle">Create guest invites and generate QR codes that let new people create their account.</p>
    </header>

    <section id="admin-login-panel" class="admin-panel fade-item">
      <h2 class="section-heading">Admin login</h2>
      <p class="section-hint">Default credentials: admin / admin123</p>
      <form id="admin-login-form">
        <label class="field">
          <span>Username</span>
          <input type="text" id="admin-user" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" id="admin-pass" required>
        </label>
        <button type="submit" class="primary-cta">Login</button>
      </form>
    </section>

    <section id="admin-dashboard" class="hidden">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px;">
        <h2 class="section-heading" style="margin:0;">Dashboard</h2>
        <button type="button" id="logout-btn" class="secondary-cta" style="padding:10px 14px;">Logout</button>
      </div>

      <div class="admin-tabs" aria-label="Admin sections">
        <button type="button" class="tab-btn is-active" data-tab="home-panel">Home</button>
        <button type="button" class="tab-btn" data-tab="guest-panel">Guests</button>
        <button type="button" class="tab-btn" data-tab="customer-panel">Customers</button>
      </div>

      <section id="home-panel" class="tab-panel is-active admin-panel fade-item">
        <h2 class="section-heading">Home page content</h2>
        <form id="home-page-form">
          <div class="admin-grid">
            <label class="field">
              <span>Headline</span>
              <input id="home-headline" type="text" placeholder="Your Link." required>
            </label>
            <label class="field">
              <span>Subheadline</span>
              <input id="home-subheadline" type="text" placeholder="One Tap." required>
            </label>
          </div>
          <label class="field">
            <span>Description</span>
            <textarea id="home-description" rows="3" placeholder="Custom NFC cards & keychains for your social, business and brand."></textarea>
          </label>
          <div class="admin-grid">
            <label class="field">
              <span>Image URL</span>
              <input id="home-image" type="url" placeholder="https://example.com/image.png">
            </label>
            <label class="field">
              <span>Upload image</span>
              <input id="home-image-upload" type="file" accept="image/*">
            </label>
          </div>
          <div class="admin-grid">
            <label class="field">
              <span>My Account button text</span>
              <input id="home-account-text" type="text" placeholder="My Account">
            </label>
          </div>
          <label class="field">
            <span>Badges (comma separated)</span>
            <input id="home-badges" type="text" placeholder="ONE TAP, FACEBOOK, TIKTOK, LINKEDIN, ANY LINK">
          </label>
          <button type="submit" class="primary-cta">Save home page</button>
        </form>
      </section>

      <section id="guest-panel" class="tab-panel">
        <section class="admin-panel fade-item">
          <h2 class="section-heading">Create guest invite</h2>
          <form id="guest-form">
            <div class="admin-grid">
              <label class="field">
                <span>Guest name</span>
                <input id="guest-name" name="name" type="text" placeholder="Jane Doe" required>
              </label>
              <label class="field">
                <span>Email</span>
                <input id="guest-email" name="email" type="email" placeholder="jane@example.com" required>
              </label>
            </div>
            <label class="field">
              <span>Notes</span>
              <input id="guest-notes" name="notes" type="text" placeholder="VIP customer, sales team...">
            </label>
            <button type="submit" class="primary-cta" id="guest-form-submit">Create invite</button>
          </form>
        </section>

        <section class="admin-panel fade-item">
          <h2 class="section-heading">Recent invites</h2>
          <div id="guest-list-container">
            <ul id="guest-list" class="guest-list"></ul>
          </div>
        </section>
      </section>

      <section id="customer-panel" class="tab-panel">
        <section class="admin-panel fade-item">
          <h2 class="section-heading">Customer accounts</h2>
          <div id="accounts-table-container" class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Status</th>
                  <th>Created</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="account-table-body"></tbody>
            </table>
          </div>
        </section>
      </section>
    </section>
  </div>

  <script src="guest-admin.js"></script>
  <script>
    function showDashboard(show) {
      const loginPanel = document.getElementById('admin-login-panel');
      const dashboard = document.getElementById('admin-dashboard');
      loginPanel.classList.toggle('hidden', show);
      dashboard.classList.toggle('hidden', !show);
    }

    function activateAdminTab(tabId) {
      const buttons = document.querySelectorAll('.tab-btn');
      const panels = document.querySelectorAll('.tab-panel');

      buttons.forEach((button) => {
        const active = button.getAttribute('data-tab') === tabId;
        button.classList.toggle('is-active', active);
      });

      panels.forEach((panel) => {
        panel.classList.toggle('is-active', panel.id === tabId);
      });
    }

    document.querySelectorAll('.tab-btn').forEach((button) => {
      button.addEventListener('click', () => {
        activateAdminTab(button.getAttribute('data-tab'));
      });
    });

    function showLoading(containerId) {
      const container = document.getElementById(containerId);
      container.innerHTML = '<div class="loading-state"><div class="loading-spinner"></div>Loading...</div>';
    }

    function showError(containerId, message, onRetry) {
      const container = document.getElementById(containerId);
      const retryBtn = onRetry ? `<button type="button" class="secondary-cta" onclick="${onRetry}">Retry</button>` : '';
      container.innerHTML = `<div class="error-state">${message}${retryBtn}</div>`;
    }

    async function renderGuestList() {
      showLoading('guest-list-container');
      try {
        const guests = await listGuestsRemote();
        const list = document.getElementById('guest-list');
        list.innerHTML = '';

        if (!guests.length) {
          const empty = document.createElement('li');
          empty.className = 'guest-item';
          empty.innerHTML = '<strong>No invites yet</strong><div class="guest-meta">Create one to generate a QR link for signup.</div>';
          list.appendChild(empty);
          return;
        }

        guests.slice().reverse().forEach((guest) => {
          const item = document.createElement('li');
          item.className = 'guest-item';

          const status = guest.status === 'used' ? 'Used' : 'Pending';
          const displayLink = guest.status === 'used' ? (guest.previewUrl || guest.signupUrl) : guest.signupUrl;
          const displayQr = guest.status === 'used' ? (guest.previewUrl ? getQrDisplayUrl(guest.previewUrl) : guest.qrUrl) : guest.qrUrl || getQrDisplayUrl(guest.signupUrl);

          item.innerHTML = `
            <strong>${guest.name}</strong>
            <div class="guest-meta">${guest.email}</div>
            <div class="guest-meta">${guest.notes || 'No notes'}</div>
            <div style="margin-top:10px;">
              <span class="status-pill ${guest.status === 'used' ? 'status-pill--used' : ''}">${status}</span>
            </div>
            <div class="qr-box">
              <img src="${displayQr}" alt="QR code for ${guest.name}" onerror="handleQrError(this, '${displayLink}')" />
            </div>
            <div class="link-row">
              <input type="text" readonly value="${displayLink}" aria-label="${guest.status === 'used' ? 'Customer preview URL' : 'Guest sign-up URL'}">
              <button class="tiny-btn" type="button" data-copy="${displayLink}">Copy</button>
            </div>
            <div class="guest-item-actions">
              <button class="table-action-btn table-action-btn--danger" type="button" data-delete-invite="${guest.id}">Delete link</button>
            </div>
          `;

          const copyBtn = item.querySelector('[data-copy]');
          copyBtn.addEventListener('click', async () => {
            await navigator.clipboard.writeText(displayLink);
            alert(guest.status === 'used' ? 'Preview link copied' : 'Invite link copied');
          });

          const deleteBtn = item.querySelector('[data-delete-invite]');
          deleteBtn.addEventListener('click', async () => {
            if (!confirm('Delete this invite?')) return;
            deleteBtn.disabled = true;
            try {
              await deleteGuestInviteRemote(guest.id);
              renderGuestList();
            } catch (err) {
              deleteBtn.disabled = false;
              alert('Failed to delete invite');
            }
          });

          list.appendChild(item);
        });
      } catch (err) {
        if (err.message === 'Admin session expired') {
          showError('guest-list-container', 'Admin session expired. Please log in again.', "window.location.href='guest-admin.html'");
          return;
        }
        showError('guest-list-container', 'Failed to load invites: ' + (err.message || 'Unknown error'), 'renderGuestList()');
      }
    }

    function renderHomePageForm() {
      const settings = getHomePageSettings();
      document.getElementById('home-headline').value = settings.headline || 'Your Link.';
      document.getElementById('home-subheadline').value = settings.subheadline || 'One Tap.';
      document.getElementById('home-description').value = settings.description || 'Custom NFC cards & keychains for your social, business and brand.';
      document.getElementById('home-image').value = settings.image || 'img/ONE TAP.png';
      document.getElementById('home-account-text').value = settings.accountText || 'My Account';
      document.getElementById('home-badges').value = Array.isArray(settings.badges) ? settings.badges.join(', ') : 'ONE TAP, FACEBOOK, TIKTOK, LINKEDIN, ANY LINK';
    }

    async function renderAccountTable() {
      showLoading('accounts-table-container');
      try {
        const accounts = await listAccountsRemote();
        const tbody = document.getElementById('account-table-body');
        tbody.innerHTML = '';

        if (!accounts.length) {
          tbody.innerHTML = '<tr><td colspan="5" class="guest-meta">No customer accounts yet.</td></tr>';
          return;
        }

        accounts.forEach((account) => {
          const row = document.createElement('tr');
          const statusLabel = (account.status || 'active') === 'inactive' ? 'Inactive' : 'Active';
          row.innerHTML = `
            <td>${account.name || 'Customer'}</td>
            <td>${account.email || '—'}</td>
            <td><span class="status-pill ${account.status === 'inactive' ? 'status-pill--used' : ''}">${statusLabel}</span></td>
            <td>${new Date(account.createdAt || Date.now()).toLocaleDateString()}</td>
            <td>
              <div class="table-action-row">
                <button class="table-action-btn" type="button" data-account-action="toggle" data-account-id="${account.id}" ${account.status === 'inactive' ? '' : ''}>${account.status === 'inactive' ? 'Activate' : 'Deactivate'}</button>
                <button class="table-action-btn table-action-btn--danger" type="button" data-account-action="delete" data-account-id="${account.id}">Delete</button>
              </div>
            </td>
          `;
          tbody.appendChild(row);
        });

        document.querySelectorAll('[data-account-action]').forEach((button) => {
          button.addEventListener('click', async () => {
            const accountId = button.getAttribute('data-account-id');
            const action = button.getAttribute('data-account-action');

            button.disabled = true;
            const originalText = button.textContent;
            button.textContent = action === 'toggle' ? '...' : 'Deleting...';

            try {
              if (action === 'toggle') {
                // Find current status
                const accounts = await listAccountsRemote();
                const account = accounts.find(item => item.id === accountId);
                if (!account) {
                  alert('Account not found');
                  return;
                }
                const newStatus = account.status === 'inactive' ? 'active' : 'inactive';
                if (newStatus === 'active') {
                  await activateAccountRemote(accountId);
                } else {
                  await deactivateAccountRemote(accountId);
                }
              } else if (action === 'delete') {
                if (!confirm('Permanently delete this account?')) {
                  button.disabled = false;
                  button.textContent = originalText;
                  return;
                }
                await deleteAccountRemote(accountId);
              }
              renderAccountTable();
            } catch (err) {
              button.disabled = false;
              button.textContent = originalText;
              if (err.message === 'Admin session expired') {
                showError('accounts-table-container', 'Admin session expired. Please log in again.', "window.location.href='guest-admin.html'");
              } else {
                alert('Failed: ' + (err.message || 'Unknown error'));
              }
            }
          });
        });
      } catch (err) {
        if (err.message === 'Admin session expired') {
          showError('accounts-table-container', 'Admin session expired. Please log in again.', "window.location.href='guest-admin.html'");
          return;
        }
        showError('accounts-table-container', 'Failed to load accounts: ' + (err.message || 'Unknown error'), 'renderAccountTable()');
      }
    }

    document.getElementById('admin-login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const submitBtn = document.querySelector('#admin-login-form .primary-cta');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in...';

      const result = await loginAdminRemote({
        username: document.getElementById('admin-user').value,
        password: document.getElementById('admin-pass').value
      });

      submitBtn.disabled = false;
      submitBtn.textContent = 'Login';

      if (!result.ok) {
        alert(result.error);
        return;
      }

      showDashboard(true);
      document.getElementById('admin-login-form').reset();
      renderGuestList();
      renderAccountTable();
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await logoutAdminRemote();
      showDashboard(false);
    });

    document.getElementById('guest-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const submitBtn = document.getElementById('guest-form-submit');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating...';

      const result = await createGuestInvite({
        name: document.getElementById('guest-name').value,
        email: document.getElementById('guest-email').value,
        notes: document.getElementById('guest-notes').value
      });

      submitBtn.disabled = false;
      submitBtn.textContent = 'Create invite';

      if (result && result.error) {
        if (result.redirect) {
          window.location.href = result.redirect;
          return;
        }
        alert(result.error);
        return;
      }

      document.getElementById('guest-form').reset();
      renderGuestList();
      alert('Guest invite created successfully');
    });

    document.getElementById('home-page-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const submitBtn = document.querySelector('#home-page-form .primary-cta');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Saving...';

      const homeFileInput = document.getElementById('home-image-upload');
      let imageValue = document.getElementById('home-image').value.trim();

      if (homeFileInput && homeFileInput.files && homeFileInput.files[0]) {
        imageValue = await readFileAsDataUrl(homeFileInput.files[0]);
      }

      const settings = {
        headline: document.getElementById('home-headline').value.trim(),
        subheadline: document.getElementById('home-subheadline').value.trim(),
        description: document.getElementById('home-description').value.trim(),
        image: imageValue,
        accountText: document.getElementById('home-account-text').value.trim() || 'My Account',
        badges: document.getElementById('home-badges').value.split(',').map(item => item.trim()).filter(Boolean)
      };

      await setHomePageSettingsRemote(settings);
      renderHomePageForm();
      submitBtn.disabled = false;
      submitBtn.textContent = 'Save home page';
      alert('Home page updated successfully');
      window.location.href = 'index.html';
    });

    // Check admin session on load
    async function init() {
      if (getAdminToken()) {
        showDashboard(true);
        renderGuestList();
        renderAccountTable();
      } else {
        showDashboard(false);
      }
    }

    init();
  </script>
</body>
</html>
